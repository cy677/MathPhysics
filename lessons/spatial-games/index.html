<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>科学小岛 · 空间与逻辑挑战</title><link rel="icon" href="../../src/assets/spatial/soma-cover.svg" type="image/svg+xml"><link rel="stylesheet" href="../../src/theme.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="games/rush.css"><link rel="stylesheet" href="games/escape.css" data-escape-style></head>
<body class="mp-page"><main class="spatial-app">
  <section id="level-picker" aria-labelledby="game-title"><div class="game-hero"><div><span class="mini-label">想一想 · 动一动 · 再进一步</span><h1 id="game-title"></h1><p id="game-description"></p><p id="game-count"></p><button id="resume" class="primary" hidden>继续上次挑战 →</button></div><img id="game-cover" alt="" width="260" height="160"><div class="game-score"><span>本游戏已获积分</span><strong id="game-points">0</strong><span id="game-maximum"></span></div></div><div class="progress-track"><div id="game-progress"></div></div><p class="score-explainer">通关获得本关积分，重玩只补记提高的部分。获得前面层次 75% 的积分，即可进入下一层；扩充题库前已开启的层次继续保留。</p><div id="tier-list"></div></section>
  <section id="play-area" hidden aria-labelledby="level-title"><div class="play-heading"><button id="choose-level">← 选择关卡</button><div><span id="level-tier" class="mini-label"></span><h1 id="level-title"></h1></div><div class="level-reward"><b id="level-max"></b><span id="level-best"></span></div><button id="restart-level">重新开始</button></div><p id="level-goal" class="level-goal"></p><div id="game-container"></div><div id="result" role="status" hidden><div><strong id="result-title"></strong><p id="result-detail"></p></div><button id="next-level" class="primary">看看下一关 →</button></div></section>
  <footer class="spatial-footer"><p id="save-status" role="status">进度保存在当前浏览器。</p><details><summary>积分说明与游戏来源</summary><p id="score-detail"></p><p id="source-detail"></p><a id="source-license"></a></details></footer>
</main><script src="../../src/theme.js"></script><script type="module" src="app.js"></script></body></html>
