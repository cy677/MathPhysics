<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>七巧板拼图 · 科学小岛</title><link rel="stylesheet" href="../jsxgraph-playground/styles.css"><style>.tangram-stage{display:block;width:100%;height:auto;min-height:280px;touch-action:none;background:#fffef9}.tangram-stage [data-piece]{cursor:grab;stroke-linejoin:round}.tangram-stage [data-piece]:active{cursor:grabbing}.tangram-stage text{pointer-events:none}.piece-buttons{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.piece-buttons button{width:38px;min-width:38px;padding:5px;color:white}.piece-buttons [aria-pressed=true]{outline:3px solid #233f32;outline-offset:3px}.board-label{display:flex;justify-content:space-between}#progress{font-weight:700;color:#40674d}label.hint{display:block;margin:16px 0}.large{font-size:17px;margin:13px 0}#feedback{min-height:30px}.board-card{align-self:start}@media(max-width:550px){.tangram-stage{min-height:240px}.movement{justify-content:center}.movement>div{margin:0}}</style></head><body>
<header><a href="../../index.html" id="back-home">← 科学小岛</a><b>七巧板拼图</b><button id="reset">重新开始</button></header><main><p class="eyebrow">移动 · 旋转 · 拼合</p><h1>七块拼板，无限想象。</h1><p class="intro">把左边的拼板搬到右边，试着填满灰色轮廓。靠近正确位置时，拼板会吸住。</p><nav id="tabs"><button data-goal="square" aria-selected="true">方形热身</button><button data-goal="creative" aria-selected="false">创意轮廓</button></nav>
<div class="workspace"><section class="board-card"><div class="board-label"><span>先点选一块，再拖动或旋转</span><span id="progress">0 / 7</span></div><svg id="puzzle" class="tangram-stage" viewBox="0 0 960 610" role="img" aria-label="拖动七巧板拼块填满目标轮廓"></svg><div class="movement"><span id="selected">已选择第1块</span><div><button data-move="left" aria-label="向左移动">←</button><button data-move="up" aria-label="向上移动">↑</button><button data-move="down" aria-label="向下移动">↓</button><button data-move="right" aria-label="向右移动">→</button></div></div></section><aside><section class="panel"><h2>动手拼一拼</h2><div id="piece-buttons" class="piece-buttons"></div><div class="presets"><button id="turn-left">↶ 左转15°</button><button id="turn-right">右转15° ↷</button></div><label class="hint"><input id="show-hint" type="checkbox">看看每块拼板的位置</label><button id="help" class="quiet">帮我放一块</button><p>拖动拼板后松手。图形放不下时，转个方向再试试。</p></section><section class="panel"><span class="badge">小挑战</span><h3 id="challenge-text">七块拼板都要用上，不留空隙，不互相重叠。</h3><label for="challenge-mode">挑战难度 <select id="challenge-mode"><option value="free">探索题 · 可以求助</option><option value="two">进阶题 · 最多求助2块</option><option value="none">独立题 · 不用“帮我放一块”</option></select></label><button id="check" class="primary">看看拼好了没有</button><p id="feedback" role="status"></p></section><details class="panel"><summary>找一找图形的秘密</summary><p>哪些三角形一样大？两个小三角形能拼成什么？平移和旋转会改变面积吗？</p></details></aside></div></main><footer><span>Tangram · GPL-3.0 <a href="../../vendor/tangram/LICENSE" target="_blank" rel="noopener">源码与许可</a></span><span>科学小岛 · 几何工坊</span></footer><script type="module" src="app.js"></script></body></html>
