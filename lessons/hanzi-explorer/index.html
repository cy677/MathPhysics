<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f3e9"><title>汉字探险家 · 科学小岛</title><link rel="stylesheet" href="../../src/theme.css"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app">
<aside aria-label="练习导航">
 <div class="brand"><span class="brand-logo" aria-hidden="true">字</span><div><h1>汉字探险家</h1><small>发现汉字的小秘密</small></div></div>
 <div><div class="section-label">汉字与字词 · 一年级</div><nav class="nav" id="nav"></nav></div>
 <div class="side-bottom"><div class="harvest"><div class="label">已经收集的学习星</div><div class="harvest-value"><span class="star">✦</span><span id="totalStars">0</span><small>颗</small></div><p>不计时，慢慢想。每完成一题，收下一颗。</p></div><div class="side-note">练习用字 425 字 · 写字表 100 字<br>课本字表 + PDF 补充字形</div></div>
</aside>
<main class="main">
 <header class="topbar"><a class="back-link" id="homeLink" href="../../index.html#subject/chinese">← 返回语文</a><div class="breadcrumb"><strong>发现 · 思考 · 练习</strong>一年级汉字工坊</div><div class="tools">
 <button class="tool-btn" id="sourceBtn" type="button"><span data-icon="book"></span>字表与资料</button>
 <button class="tool-btn" id="wrongBtn" type="button"><span data-icon="bookmark"></span>错题本 <span class="badge" id="wrongCount">0</span></button>
 <button class="tool-btn" id="soundBtn" type="button" aria-pressed="false"><span data-icon="sound"></span><span id="soundLabel">音效关</span></button>
 <button class="tool-btn" id="fullBtn" type="button"><span data-icon="expand"></span><span>全屏</span></button>
 </div></header>
 <div class="intro-row"><div><h2 id="modeTitle">笔画小侦探</h2><p id="modeIntro">在心里写一写，找出指定的那一笔。</p></div><span class="tiny-tag" id="scopeTag">写字表重点练习</span></div>
 <section class="config" aria-label="练习设置">
 <label>用字范围<select id="scopeSelect"><option value="all">全部用字 425 字</option><option value="write">只用写字表 100 字</option></select></label>
 <label>每次练习<select id="batchSelect"><option value="10">10 题</option><option value="20">20 题</option><option value="30">30 题</option><option value="0">自由练习</option></select></label>
 <label id="choiceConfig">选择数量<select id="choiceSelect"><option value="2">2 个</option><option value="3" selected>3 个</option></select></label>
 <label id="tileConfig">每组字数<select id="tileSelect"><option value="5">5 个</option><option value="6" selected>6 个</option></select></label>
 <div class="config-end"><button class="link-btn hidden" id="randomQuestionBtn" type="button"><span data-icon="shuffle"></span>随机换题</button><button class="link-btn" id="restartBtn" type="button">重新开始本组</button></div>
 </section>
 <section class="difficulty-panel hidden" id="radicalDifficulty" aria-label="偏旁分类难度"><span class="difficulty-caption">偏旁难度</span><div class="level-switch" id="levelSwitch" role="group" aria-label="选择偏旁分类难度"></div></section>
 <section class="workspace" id="workspace" aria-label="当前练习">
 <div class="question-meta"><div class="eyebrow" id="questionType"></div><div class="round-meta"><span id="roundLabel">第 1 题 / 10</span><div class="progress-track" role="progressbar" aria-label="本组进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progressFill"></i></div></div></div>
 <h3 class="question-title" id="questionTitle" tabindex="-1"></h3><p class="question-sub" id="questionSub"></p>
 <div class="question-content" id="questionContent"></div>
 <div class="feedback" id="feedback" role="status" aria-live="polite"><span class="feedback-icon">?</span><span>认真看一看，再选出你的答案。</span></div>
 <div class="question-actions" id="questionActions"><div class="action-left"><button class="btn" id="readBtn" type="button"><span data-icon="sound"></span>读题</button><button class="btn" id="revealBtn" type="button">看答案</button></div><button class="btn primary" id="nextBtn" type="button" disabled>下一题 <span data-icon="arrow"></span></button></div>
 <div class="answer-details" id="answerDetails"></div>
 </section>
 <details class="parent" id="parentBox"><summary><span data-icon="idea"></span>家长怎么讲 <span style="font-size:10px;color:#99a18e">结合当前题目</span></summary><div class="parent-body" id="parentBody"></div></details>
 <footer class="footnote">看见字的模样，读懂词的意思。每天发现一点新知识。</footer>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-header"><h3 id="modalTitle">字表与资料</h3><button class="close-btn" id="closeModal" type="button" aria-label="关闭">×</button></header><div class="modal-tabs" id="modalTabs"></div><div class="modal-body" id="modalBody"></div></section></div>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:30px;text-align:center">请在允许 JavaScript 的浏览器中打开此文件。系统文件预览可能不能运行互动练习。</p></noscript>



<script type="module" src="app.js"></script>
</body></html>
