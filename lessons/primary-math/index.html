<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数与生活 · MathPhysics</title><meta name="color-scheme" content="light"><link rel="stylesheet" href="../../src/theme.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="practice.css"></head>
<body id="top" class="mp-page mp-primary-math">
<header><a class="brand" id="back-home" href="../../index.html" aria-label="返回科学小岛">◒ 科学小岛</a><div class="header-note">数与生活</div></header>
<main>
<nav class="learning-switch" aria-label="练习内容"><button type="button" id="content-curriculum" aria-pressed="true">知识点练习</button><button type="button" id="content-word-problems" aria-pressed="false">生活应用题</button></nav>

<div class="filters learning-filters"><label>年级<select id="grade"></select></label><label>层次<select id="learning-level"><option value="1">基础</option><option value="2">巩固</option><option value="3">提高</option></select></label><label class="unit-filter">知识点<select id="learning-unit"></select></label><button type="button" id="knowledge-help" class="mp-help-trigger">知识提示</button></div>
<div id="learning-progress" class="learning-progress" role="status" aria-live="polite"></div>
<section id="practice" class="practice-section" aria-label="分层练习">
<div class="practice-layout"><aside class="practice-settings" aria-label="练习设置">
<form id="practice-settings"><label id="practice-topic-field" hidden>分类<select id="practice-topic"><option value="all">全部</option></select></label><label>题型<select id="practice-template"><option value="all">混合练习</option></select></label><input id="practice-difficulty" type="hidden" value="1"><label>题目数量<input id="practice-count" type="number" min="1" max="500" step="1" value="8" required></label><button type="submit" class="primary">生成练习</button><button type="button" id="practice-new-seed">换一组</button></form>
<details><summary>保存、恢复与打印</summary><div class="practice-tools"><button type="button" id="practice-export-student">导出练习题</button><button type="button" id="practice-export-teacher">导出题目与解析</button><button type="button" id="practice-export-recipe">保存练习设置</button><label>恢复练习设置<input type="file" id="practice-import" accept=".json,application/json"></label><button type="button" id="practice-print">打印</button></div></details>
</aside><div class="practice-workspace"><div id="practice-status" role="status" aria-live="polite"></div><div id="practice-score" class="practice-score" aria-live="polite"></div><div id="practice-questions"></div></div></div></section>
<section id="word-problems" class="practice-section word-problems" aria-label="生活应用题" hidden>
<div class="word-intro"><div><h2>生活应用题</h2><p>从生活里找数量关系，先读清所求，再想怎样计算。</p></div><button type="button" id="word-back">返回知识点练习</button></div>
<p id="word-count-note" class="word-review-status" aria-live="polite"></p>
<div class="practice-layout"><aside class="practice-settings" aria-label="应用题设置"><form id="word-settings">
<label>题库<select id="word-collection"><option value="foundation">基础应用题</option><option value="gsm8k">综合应用题</option></select></label>
<label>方式<select id="word-mode"><option value="practice">自主练习</option><option value="demo">跟着讲解</option><option value="assessment">正式考核</option></select></label>
<label>分类<select id="word-category"></select></label><label>子类<select id="word-subcategory"><option value="all">全部子类</option></select></label>
<label>层次<select id="word-level"><option value="all">全部层次</option></select></label><label>题目数量<input id="word-count" type="number" min="1" max="20" step="1" value="5" required></label>
<label id="word-objective-label" hidden>考核能力<select id="word-objective"></select></label>
<button type="submit" class="primary" id="word-generate">生成练习</button><button type="button" id="word-new">换一组</button></form>
<p class="word-mode-note" id="word-mode-note"></p><p class="word-reward-note" id="word-reward-note">练习、提示与讲解不计成长分。正式考核由服务器签发和判题，同一能力只记录最佳成绩的提高。</p>
</aside><div class="practice-workspace"><div id="word-status" role="status" aria-live="polite"></div><button type="button" id="word-retry" hidden>重试加载</button>
<div id="word-progress" class="practice-score" aria-live="polite"></div><div id="word-result" class="word-result" aria-live="polite" hidden></div>
<div id="word-questions"></div><button type="button" class="primary" id="word-finish" hidden>完成考核</button></div></div>
</section>
</main><noscript>请允许 JavaScript 后打开课堂。</noscript><link rel="stylesheet" href="../../src/sync-ui.css"><script src="../../src/sync-client.js"></script><script src="../../src/sync-ui.js"></script><script src="../../src/progress.js"></script><script type="module" src="app.mjs"></script><script src="../../src/theme.js"></script></body></html>
