<section class="question-card"><div class="meta"><span id="code"></span><span id="topic"></span></div><h2 id="title"></h2><p id="prompt"></p></section>
<section class="lab" aria-labelledby="lab-title"><div class="lab-head"><h3 id="lab-title">01 观察与调整</h3><button id="reset" type="button">重新摆放</button></div><div class="scene-wrap" tabindex="0" role="region" aria-label="模型画板，小屏幕可左右滑动"><svg id="scene" viewBox="0 0 720 360" role="img" aria-labelledby="scene-title scene-desc"></svg></div><p class="pan-hint">左右滑动模型，可以看清完整图形。</p><div class="trial-control" role="group" aria-labelledby="trial-label"><div class="trial-heading"><label id="trial-label" for="trial">拖动试一试</label><output id="trial-value" for="trial"></output></div><div class="slider-row"><button id="minus" type="button" aria-label="减少试验值">−</button><input id="trial" type="range" aria-describedby="model-note"><button id="plus" type="button" aria-label="增加试验值">＋</button><button id="play" type="button" aria-pressed="false">播放变化</button></div></div><p id="model-note" class="model-note"></p><p class="micro">拖动滑块，或用加减按钮、键盘方向键。看清变化，再填答案。</p></section>
