name: Install and verify geometry collection
on:
  push:
    branches: [main]
    paths: ['.github/geometry-install/**', '.github/workflows/install-geometry.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geometry-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize reviewed source snapshot
        run: python .github/geometry-install/install.py
      - run: npm install --ignore-scripts
      - run: npm test
      - run: python scripts/build_geometry_standalone.py
      - run: npx playwright install --with-deps chromium
      - name: Verify all geometry lessons and actual host/file loading
        run: node tests/geometry-browser.mjs
      - name: Commit verified source and evidence without overwriting newer work
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons src config/local-activities.json config/defaults.json scripts/package.py scripts/build_geometry_standalone.py package.json package-lock.json tests docs/geometry-proofs.md docs/geometry-test-report.json docs/geometry-unit-test-report.txt docs/geometry-browser-report.json docs/geometry-screenshots README.md THIRD_PARTY_NOTICES.md .github/workflows/geometry.yml
          git rm -r .github/geometry-install .github/workflows/install-geometry.yml
          git commit -m 'feat: add 24 original geometry proofs with complete lesson catalog and verified standalone HTML'
          git push origin HEAD:main
      - name: Package full offline project
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MathPhysics-geometry-delivery
          path: |
            dist/MathPhysics-Geometry-Proofs.html
            dist/MathPhysics-offline.zip
            docs/geometry-browser-report.json
            docs/geometry-screenshots/
          retention-days: 30
