name: Spaceflight SVG verification
on:
  push:
    branches: ['main', 'feature/spaceflight-svg-cz10b-20261002']
    paths: ['lessons/spaceflight/**', 'tests/spaceflight*', 'scripts/build_spaceflight_standalone.py', '.github/workflows/spaceflight-svg.yml']
  pull_request:
    paths: ['lessons/spaceflight/**', 'tests/spaceflight*', 'scripts/build_spaceflight_standalone.py', '.github/workflows/spaceflight-svg.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spaceflight-svg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax and standalone bundle
        run: |
          test ! -d scripts/.spaceflight-edits
          for f in lessons/spaceflight/*.js; do node --check "$f"; done
          python scripts/build_spaceflight_standalone.py
      - name: Unit and model regression tests
        run: |
          set -o pipefail
          mkdir -p output/spaceflight-svg
          node --test tests/spaceflight.test.mjs tests/spaceflight-fusion.test.mjs tests/spaceflight-integration.test.mjs tests/spaceflight-svg.test.mjs 2>&1 | tee output/spaceflight-svg/unit-tests.txt
      - name: Install browser verification dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify UI and regenerate vector illustrations
        run: |
          python tests/spaceflight-svg-browser.py
          python - <<'PY'
          import json
          report=json.load(open('output/spaceflight-svg/report.json'))
          assert report['vector_files']==102 and report['render_cases']==288
          assert not report['browser_errors'] and report['external_http_requests']==0
          PY
          git diff --exit-code -- lessons/spaceflight/assets
      - name: Package verified module and standalone classroom
        run: |
          tar -czf output/spaceflight-svg/module.tar.gz lessons/spaceflight src/theme.css src/theme.js src/progress.js docs/spaceflight-svg-review.md scripts/build_spaceflight_standalone.py tests/spaceflight-svg.test.mjs tests/spaceflight-svg-browser.py dist/MathPhysics-Spaceflight.html LICENSE THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spaceflight-svg-evidence
          path: output/spaceflight-svg/
          if-no-files-found: warn
          retention-days: 14
