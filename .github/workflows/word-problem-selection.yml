name: Word-problem selection
on:
  workflow_dispatch:
  push:
    branches: [feature/curated-word-problems-20261005]
    paths:
      - '.github/workflows/word-problem-selection.yml'
      - 'question-banks/selection/**'
      - 'question-banks/SOURCE_LOCK.json'
permissions:
  contents: write
concurrency:
  group: word-problem-selection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch locked upstream datasets
        run: |
          python question-banks/selection/fetch_sources.py --source-root .selection-sources
      - name: Build all selections and verify
        run: |
          rm -rf question-banks/curated
          python question-banks/selection/build.py --source-root .selection-sources --output question-banks/curated
          python -m unittest discover -s question-banks/selection -p 'test*.py' -v
          python question-banks/selection/validate_audit.py --source-root .selection-sources
          python question-banks/selection/build.py --source-root .selection-sources --output question-banks/curated --check
      - name: Commit generated selection ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-banks/curated
          if ! git diff --cached --quiet; then
            git commit -m "data(question-banks): regenerate audited classifications and representatives"
            git push
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: word-problem-selection-report
          path: question-banks/curated/
          retention-days: 7
