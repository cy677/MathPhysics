name: Chinese question bank
on:
  push:
    branches: ['main', 'feature/zh-question-generators-*', 'codex/**']
  pull_request:
    paths:
      - 'lessons/question-bank/**'
      - 'tests/question-bank*'
      - 'scripts/generate_questions.mjs'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/question-bank.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All unit and integration tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Chinese question bank browser checks
        run: python tests/question-bank-browser.py
