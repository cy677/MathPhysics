name: Numbers and life question bank
on:
  workflow_dispatch:
  push:
    branches: ['main', 'feature/zh-question-generators-*', 'codex/**']
  pull_request:
    paths:
      - 'lessons/question-bank/**'
      - 'lessons/primary-math/**'
      - 'tests/question-bank*'
      - 'tests/questions-learning*'
      - 'tests/numbers-life*'
      - 'tests/singapore-curriculum*'
      - 'tests/primary-math*'
      - 'tests/phet-*'
      - 'tests/fixtures/questions-algorithm-baseline.json'
      - 'tests/fixtures/intentional-failure.mjs'
      - 'scripts/generate_questions.mjs'
      - 'scripts/build_primary_math_standalone.py'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/question-bank.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - name: All unit and integration tests
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: npx playwright install --with-deps chromium
      - name: Build unified offline classroom
        run: npm run build:primary
      - name: Confirm assertion failures propagate and release browser resources
        run: npm run test:questions:failure
      - name: Unified classroom browser checks
        run: npm run test:questions:browser
      - name: Every template, fixed challenge and knowledge unit in the real page
        run: npm run test:questions:learning:browser
      - name: Native generated game questions and molecule collection targets
        run: |
          npm run test:phet-questions:browser
          npm run test:phet-molecule-questions:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Numbers-and-life-learning-evidence
          path: |
            docs/learning-coverage/questions.json
            docs/learning-coverage/phet-questions.json
            docs/learning-coverage/phet-molecule-questions.json
            docs/learning-coverage/phet-other-question-audit.json
            output/playwright/numbers-life-sg/
            output/playwright/numbers-life-failure/
            output/playwright/learning-coverage/questions/
            output/playwright/learning-coverage/phet-questions/
            output/playwright/learning-coverage/phet-molecule/
            output/phet-questions-observed-history.json
