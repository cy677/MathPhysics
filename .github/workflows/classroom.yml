name: Classroom verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lessons/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/classroom.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'lessons/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/classroom.yml'
permissions:
  contents: read
concurrency:
  group: classroom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-entrypoints:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python detection and argument forwarding
        run: node --test tests/python.test.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check complete catalog and mathematics
        run: |
          set -o pipefail
          npm ci --ignore-scripts
          npm test | tee docs/classroom-unit-report.txt
      - name: Build self-contained classroom files
        run: |
          npm run standalone:geometry
          npm run build:spaceflight
          npm run build:playground
          npm run build:primary
      - name: Install browser test dependency
        run: |
          npx playwright install --with-deps chromium
          node scripts/python.mjs -m pip install playwright==1.56.0
          node scripts/python.mjs -m playwright install --with-deps chromium
      - name: Verify real HTTP, file loading and interactions
        run: npm run test:classroom
      - name: Verify selectively integrated learning interactions
        run: node scripts/python.mjs tests/unique-features-browser.py
      - name: Verify geometry lessons
        run: node tests/geometry-browser.mjs
      - name: Verify current questions and failure propagation
        run: |
          npm run test:questions:failure
          npm run test:questions:browser
          npm run test:questions:learning:browser
      - name: Verify demonstration learning and classroom questions
        run: |
          npm run test:demo-learning:browser
          npm run test:local-learning:browser
      - name: Verify native generated questions and molecule collection targets
        run: |
          npm run test:phet-questions:browser
          npm run test:phet-molecule-questions:browser
      - name: Verify current science viewport layout and native input coordinates
        run: |
          npm run test:demo-layout:browser
          npm run test:phet-display-compat:browser
      - name: Package offline classroom
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MathPhysics-classroom-delivery
          path: |
            dist/MathPhysics-offline.zip
            dist/MathPhysics-Playground.html
            dist/MathPhysics-Tangram.html
            dist/MathPhysics-Geometry-Proofs.html
            dist/MathPhysics-Spaceflight.html
            dist/MathPhysics-Primary-Math.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MathPhysics-classroom-evidence
          path: |
            docs/classroom-browser-report.json
            docs/classroom-unit-report.txt
            docs/classroom-screenshots/
            docs/geometry-browser-report.json
            docs/learning-coverage/
            output/playwright/learning-coverage/
            output/phet-questions-observed-history.json
            output/playwright/numbers-life-sg/
          retention-days: 30
