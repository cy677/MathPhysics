name: Classroom verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lessons/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/classroom.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'lessons/**'
      - 'config/**'
      - 'tests/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/classroom.yml'
permissions:
  contents: read
concurrency:
  group: classroom-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check complete catalog and mathematics
        run: |
          npm ci --ignore-scripts
          npm test | tee docs/classroom-unit-report.txt
      - name: Build self-contained classroom files
        run: |
          python scripts/build_geometry_standalone.py
          python scripts/build_spaceflight_standalone.py
          python scripts/build_playground_standalone.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify real HTTP, file loading and interactions
        run: python tests/classroom-browser.py
      - name: Verify geometry lessons
        run: node tests/geometry-browser.mjs
      - name: Package offline classroom
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MathPhysics-classroom-delivery
          path: |
            dist/MathPhysics-offline.zip
            dist/MathPhysics-Playground.html
            dist/MathPhysics-Tangram.html
            dist/MathPhysics-Geometry-Proofs.html
            dist/MathPhysics-Spaceflight.html
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MathPhysics-classroom-evidence
          path: |
            docs/classroom-browser-report.json
            docs/classroom-unit-report.txt
            docs/classroom-screenshots/
            docs/geometry-browser-report.json
          retention-days: 30
