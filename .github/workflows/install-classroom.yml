name: Install and verify classroom v0.4
on:
  workflow_dispatch:
  push:
    branches: [feature/child-friendly-nonphet-20260928]
    paths: ['.github/workflows/install-classroom.yml']
permissions:
  contents: write
concurrency:
  group: classroom-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and install reviewed source snapshot
        run: |
          python .github/classroom-install/install.py
          python - <<'PY'
          from pathlib import Path
          patches = {
            'tests/classroom-browser.py': [
              ("str(OUT/'host-'+id+'.png')", "str(OUT/('host-'+id+'.png'))"),
              ("elif id=='geometry-proofs':page.frame_locator('iframe').locator('.back-home').click()", "elif id=='geometry-proofs':page.frame_locator('iframe').locator('#back-home').click()"),
              ("     assert page.locator('iframe').count()==0", "     page.wait_for_selector('iframe',state='detached');assert page.locator('iframe').count()==0")
            ],
            'lessons/geometric-proofs/app.js': [
              ("if(window.parent!==window||location.protocol==='file:')el('back-home').hidden=true;", "if(window.parent===window&&location.protocol==='file:')el('back-home').hidden=true;"),
              ("const homeLink=document.querySelector('.back-home');", "const homeLink=el('back-home');"),
              ("。数值核对不代替一般证明。", "。试着改变一个条件，再算一算。")
            ]
          }
          for name, replacements in patches.items():
            path = Path(name)
            source = path.read_text()
            for before, after in replacements:
              assert source.count(before) == 1, (name, before)
              source = source.replace(before, after)
            path.write_text(source)
          PY
      - name: Test mathematics, inventory, licensing and settings migration
        run: |
          npm install --ignore-scripts
          npm test | tee docs/classroom-unit-report.txt
      - name: Build self-contained classroom files
        run: |
          python scripts/build_geometry_standalone.py
          python scripts/build_spaceflight_standalone.py
          python scripts/build_playground_standalone.py
      - name: Install browser testing dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real HTTP and file loading, all activities and interactions
        run: python tests/classroom-browser.py
      - name: Geometry regression checks
        run: node tests/geometry-browser.mjs
      - name: Commit verified application without overwriting newer work
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE README.md THIRD_PARTY_NOTICES.md index.html src lessons config scripts tests docs package.json package-lock.json vendor/matter/demo/mathphysics.html
          if ! git diff --cached --quiet; then
            git commit -m 'feat: child-friendly classroom with six JSXGraph activities, flat tangram and varied recommended content'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Package complete offline classroom
        run: python scripts/package.py
      - name: Upload classroom delivery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MathPhysics-v0.4-delivery
          path: |
            dist/MathPhysics-offline.zip
            dist/MathPhysics-Playground.html
            dist/MathPhysics-Tangram.html
            dist/MathPhysics-Geometry-Proofs.html
            dist/MathPhysics-Spaceflight.html
          retention-days: 30
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MathPhysics-v0.4-evidence
          path: |
            docs/classroom-browser-report.json
            docs/classroom-unit-report.txt
            docs/classroom-screenshots/
            docs/geometry-browser-report.json
          retention-days: 30
