name: Prepare playground dependency
on:
  workflow_dispatch:
  push:
    branches: [feature/child-friendly-nonphet-20260928]
    paths: ['.github/workflows/prepare-playground.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified npm package
        run: |
          python - <<'PY'
          import urllib.request, json, hashlib, base64, tarfile, io, pathlib
          version = '1.12.2'
          metadata = json.load(urllib.request.urlopen('https://registry.npmjs.org/jsxgraph/' + version))
          url = metadata['dist']['tarball']
          assert url == 'https://registry.npmjs.org/jsxgraph/-/jsxgraph-' + version + '.tgz'
          raw = urllib.request.urlopen(url).read()
          algorithm, expected = metadata['dist']['integrity'].split('-', 1)
          assert algorithm == 'sha512'
          assert base64.b64encode(hashlib.sha512(raw).digest()).decode() == expected
          root = pathlib.Path('vendor/jsxgraph')
          root.mkdir(parents=True, exist_ok=True)
          files = {}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              for member in archive.getmembers():
                  parts = pathlib.PurePosixPath(member.name).parts
                  assert parts[0] == 'package' and '..' not in parts
                  if not member.isfile():
                      continue
                  rel = pathlib.Path(*parts[1:])
                  if rel.suffix.lower() in ('.ttf', '.otf', '.woff', '.woff2', '.eot'):
                      continue
                  data = archive.extractfile(member).read()
                  path = root / rel
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  files[str(path)] = {'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}
          assert (root/'distrib/jsxgraphcore.js').is_file()
          assert (root/'LICENSE.MIT').is_file()
          pathlib.Path('config/libraries-lock.json').write_text(json.dumps({'schemaVersion':1,'jsxgraph':{'version':version,'source':'https://github.com/jsxgraph/jsxgraph','license':'MIT','tarball':url,'integrity':metadata['dist']['integrity'],'sha256':hashlib.sha256(raw).hexdigest(),'files':files}},ensure_ascii=False,indent=2)+'\n')
          print('Verified JSXGraph', version, len(files), 'files')
          PY
      - name: Commit dependency without overwriting newer work
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/jsxgraph config/libraries-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: vendor JSXGraph 1.12.2 with MIT attribution and verified hashes'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MathPhysics-playground-dependency
          path: |
            vendor/jsxgraph
            config/libraries-lock.json
          retention-days: 7
