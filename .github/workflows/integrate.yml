name: Integrate and verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'config/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - '.github/workflows/integrate.yml'
permissions:
  contents: write
concurrency:
  group: mathphysics-integrate
  cancel-in-progress: true
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[assets]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import complete pinned upstream content
        run: npm run import
      - name: Check inventory and local links
        run: node --test tests/catalog.test.mjs
      - name: Prepare full snapshot for reproducible diagnostics
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: MathPhysics-unverified-snapshot
          path: dist/MathPhysics-offline.zip
          retention-days: 7
      - name: Install browser test dependency
        run: npm install --ignore-scripts && npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: node tests/smoke.mjs
      - name: Commit verified assets and inventory
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo 'A newer source commit exists; its run will publish the current assets.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f vendor
          git add config/upstream-lock.json config/inventory.json docs/import-report.md docs/test-report.json docs/screenshots package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: vendor complete licensed activities and verify inventory [assets]'
            git push origin HEAD:main
          fi
      - name: Build verified offline distribution
        run: npm run package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MathPhysics-test-evidence
          path: |
            docs/test-report.json
            docs/screenshots/
            docs/import-report.md
            config/inventory.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MathPhysics-offline
          path: dist/MathPhysics-offline.zip
          retention-days: 30
