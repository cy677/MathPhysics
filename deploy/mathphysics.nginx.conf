# Include only inside the existing meow HTTPS server block.
# The root location and all existing meow proxy settings stay unchanged.
location = /mathphysics {
    return 308 /mathphysics/$is_args$args;
}
location ^~ /mathphysics/ {
    alias /srv/mathphysics/current/;
    index index.html;
    autoindex off;
    server_tokens off;
    etag off;
    if_modified_since off;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/mathphysics.access.log;
    error_log /var/log/nginx/mathphysics.error.log;

    # Serve only the classroom references; other internal docs remain blocked.
    location = /mathphysics/docs/primary-math-curriculum.md {
        alias /srv/mathphysics/current/docs/primary-math-curriculum.md;
        types { }
        default_type text/plain;
        charset utf-8;
    }
    location = /mathphysics/docs/primary-math-catalog.md {
        alias /srv/mathphysics/current/docs/primary-math-catalog.md;
        types { }
        default_type text/plain;
        charset utf-8;
    }
    # Explicit MIME for the three authored ES modules under nosniff.
    location ~ ^/mathphysics/lessons/primary-math/(app|bank|math)\.mjs$ {
        alias /srv/mathphysics/current/lessons/primary-math/$1.mjs;
        types { }
        default_type application/javascript;
    }
    location ~ (^|/)\. { return 404; }
    location ~ ^/mathphysics/(scripts|tests|deploy|docs)(/|$) { return 404; }
    location ~ ^/mathphysics/package(-lock)?\.json$ { return 404; }
    location = /mathphysics/healthz {
        default_type text/plain;
        return 200 "mathphysics ok\n";
    }
}
