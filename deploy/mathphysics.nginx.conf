# Include inside the existing HTTPS server block.
# The learning service serves public classroom files and the scoped API.
location = /mathphysics {
    return 308 /mathphysics/$is_args$args;
}
location = /mathphysics/BUILD.json {
    alias /srv/mathphysics/current/BUILD.json;
    types { }
    default_type application/json;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /mathphysics/lessons/sudoku/manifest.webmanifest {
    alias /srv/mathphysics/current/lessons/sudoku/manifest.webmanifest;
    types { }
    default_type application/manifest+json;
    charset utf-8;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /mathphysics/vendor/games/spatial/soma/LICENSE {
    alias /srv/mathphysics/current/vendor/games/spatial/soma/LICENSE;
    types { }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /mathphysics/vendor/games/spatial/escape-run/LICENSE {
    alias /srv/mathphysics/current/vendor/games/spatial/escape-run/LICENSE;
    types { }
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}
location = /mathphysics/healthz {
    default_type text/plain;
    return 200 "mathphysics ok\n";
}
location ^~ /mathphysics/api/ {
    proxy_pass http://127.0.0.1:8317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/mathphysics.access.log;
    error_log /var/log/nginx/mathphysics.error.log;
}
location ^~ /mathphysics/ {
    proxy_pass http://127.0.0.1:8317;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    server_tokens off;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    access_log /var/log/nginx/mathphysics.access.log;
    error_log /var/log/nginx/mathphysics.error.log;
}
